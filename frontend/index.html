<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recipe Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Recipe Search Engine</h1>

<form>
    <div class="field">
        <label for="all-ingredients" class="ingredient-label">Ingrédients à inclure (ALL)</label>
        <input type="search" id="all-ingredients">
    </div>

    <div class="field">
        <label for="any-ingredients" class="ingredient-label">Au moins un de ces ingrédients (ANY)</label>
        <input type="search" id="any-ingredients">
    </div>

    <div class="field">
        <label for="none-ingredients" class="ingredient-label">Ingrédients à exclure (NONE)</label>
        <input type="search" id="none-ingredients">
    </div>

    <button type="submit">Rechercher</button>
</form>

<div id="results"></div>

<dialog id="recipe-details">
    <form method="dialog">
        <button>Fermer</button>
    </form>
    <p><strong>Origine :</strong> <span id="dialog-country"></span></p>
    <ul id="dialog-ingredients"></ul>
    <p id="dialog-instructions"></p>
    <p><a id="dialog-video" href="" target="_blank" rel="noopener">Regarder la vidéo</a></p>
</dialog>
<script src="script.js"></script>
</body>

</html>
