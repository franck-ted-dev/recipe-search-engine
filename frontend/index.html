<!DOCTYPE html>
<html>
<head>
    <title>Recipe Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Recipe Search Engine</h1>

<form>
    <div class="field">
        <label for="all-ingredients" class="ingredient-label">Ingredients à inclure (ALL)</label>
        <input type="search" id="all-ingredients">
    </div>

    <div class="field">
        <label for="any-ingredients" class="ingredient-label">Au moins un de ces ingredients (ANY)</label>
        <input type="search" id="any-ingredients">
    </div>

    <div class="field">
        <label for="none-ingredients" class="ingredient-label">Ingredients à exclure (NONE)</label>
        <input type="search" id="none-ingredients">
    </div>

    <button type="submit">Rechercher</button>
</form>
</body>
</html>
