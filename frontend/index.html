<!DOCTYPE html>
<html>
  <head>
    <title>Recipe Search Engine</title>
  </head>
  <body>
    <h1>Recipe Search Engine</h1>

    <form>
      <label for="all-ingredients">Ingredients à inclure (ALL)</label>
      <input type="search" id="all-ingredients">

      <label for="any-ingredients">Au moins un de ces ingredients (ANY)</label>
      <input type="search" id="any-ingredients">

      <label for="none-ingredients">Ingredients à exclure (NONE)</label>
      <input type="search" id="none-ingredients">

      <button type="submit">Rechercher</button>
    </form>
  </body>
</html>
