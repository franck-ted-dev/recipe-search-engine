<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recipe Search Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Recipe Search Engine</h1>

<datalist id="ingredients-list"></datalist>

<form>
    <div class="field">
        <label class="ingredient-label">Ingrédients à inclure (ALL)</label>
        <div class="ingredient-fields" data-category="all"></div>
        <button type="button" class="add-ingredient" data-category="all">+ Ajouter un ingrédient</button>
    </div>

    <div class="field">
        <label class="ingredient-label">Au moins un de ces ingrédients (ANY)</label>
        <div class="ingredient-fields" data-category="any"></div>
        <button type="button" class="add-ingredient" data-category="any">+ Ajouter un ingrédient</button>
    </div>

    <div class="field">
        <label class="ingredient-label">Ingrédients à exclure (NONE)</label>
        <div class="ingredient-fields" data-category="none"></div>
        <button type="button" class="add-ingredient" data-category="none">+ Ajouter un ingrédient</button>
    </div>

    <button type="submit">Rechercher</button>
</form>

<div id="results"></div>

<dialog id="recipe-details">
    <form method="dialog">
        <button>Fermer</button>
    </form>
    <p><strong>Origine :</strong> <span id="dialog-country"></span></p>
    <ul id="dialog-ingredients"></ul>
    <p id="dialog-instructions"></p>
    <p><a id="dialog-video" href="" target="_blank" rel="noopener">Regarder la vidéo</a></p>
</dialog>
<script src="script.js"></script>
</body>

</html>
